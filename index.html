<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Otter Couple Love Story</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fef6ff, #ffe2f0);
      font-family: "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      width: 380px;
      padding: 32px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(255, 140, 170, 0.25);
      backdrop-filter: blur(8px);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 8px solid #fff;
      box-shadow: 0 12px 25px rgba(255, 150, 170, 0.28);
      margin-bottom: 18px;
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      color: #ff6fae;
    }

    p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
      margin: 18px 0 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      background: #ff8fbb;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      transition: 0.22s ease;
      box-shadow: 0 12px 25px rgba(255, 150, 170, 0.28);
    }

    .btn:hover {
      background: #ff74ac;
      transform: translateY(-3px);
      box-shadow: 0 16px 30px rgba(255, 150, 170, 0.35);
    }

    .cute {
      font-size: 22px;
      margin-top: 20px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .gallery {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 12px;
}

.gallery img {
  width: 80px;
  height: 80px;
  border-radius: 15px;
  object-fit: cover;
  box-shadow: 0 8px 18px rgba(255, 150, 170, 0.25);
  transition: transform .2s ease;
}

.gallery img:hover {
  transform: scale(1.07);
}

  </style>
</head>
<body>
  <div class="card">
    <img src="we.jpg" class="profile-img" alt="otter couple" />
<div class="gallery">
  <img src="we2.jpg" alt="couple photo">
  <img src="we3.jpg" alt="couple photo">
  <img src="we4.jpg" alt="couple photo">
</div>

    <h1>정민 미성 커플의 하루 🦦💞</h1>

    <p>
      서로 손 꼭 잡고 잠드는 수달처럼,  
      우리 둘만의 달달한 순간들을 기록하는 공간이에요.  
      귀여운 꽁냥 연애 숏츠 속 장면처럼요 ✨
    </p>

    <a href="story.html" class="btn">커플 스토리 보기 🫶</a>
<a href="couple-slide.html" class="btn">사진 슬라이드 보기 📸</a>

    <div class="cute">🦦💕🦦</div>
  </div>
</body>
</html>
