<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>나의 미니 웹앱</title>
    <style>
        body {
            background-color: #f2f2f2;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 30px;
        }

        img {
            border-radius: 50%;
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>나의 첫 미니 웹앱</h1>
    <p>버튼을 눌러 다양한 기능을 체험해보세요!</p>

    <!-- 기본 사진 -->
    <img id="profileImg" src="사진1.jpg" />

    <div>
        <button onclick="changeImage()">사진 바꾸기</button>
        <button onclick="randomMessage()">랜덤 문구</button>
        <button onclick="changeColor()">배경색 바꾸기</button>
    </div>

    <p id="message"></p>

    <script>
        // (1) 사진 바꾸기
        const images = ["강백호.jpg", "서태웅.jpg", "채치수.jpg"];
        let currentImg = 0;

        function changeImage() {
            currentImg = (currentImg + 1) % images.length;
            document.getElementById("profileImg").src = images[currentImg];
        }

        // (2) 랜덤 문구
        const messages = [
            "오늘도 파이팅! 🚀",
            "너는 지금 배우고 있어. 멈추지 마!",
            "작은 한 걸음이 큰 변화를 만든다.",
            "개발은 재미있다! 😄",
            "너는 이미 잘하고 있어!"
        ];

        function randomMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("message").innerText = messages[randomIndex];
        }

        // (3) 배경색 바꾸기
        function changeColor() {
            const randomColor = "#" + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        }
    </script>

</body>
</html>
